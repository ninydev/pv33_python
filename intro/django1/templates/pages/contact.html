{% extends 'layouts/base.html' %}

{% block content %}


    {% if message %}
        <div class="alert alert-success row">
            {{ message }}
        </div>
    {% endif %}
<div class="row">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Send</button>
    </form>
</div>

{% endblock %}
